<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>SalesTracker</title>
    <style>
        body { font-family: Arial; padding: 1rem; }
        table { border-collapse: collapse; width: 100% }
        td, th { border: 1px solid #ddd; padding: 6px; }
    </style>
</head>
<body>
<h1>SalesTracker</h1>

<h2>Add</h2>
<form id="addForm">
    <select name="kind"><option value="income">income</option><option value="expense">expense</option></select>
    <input name="amount" type="number" step="0.01" placeholder="amount" required />
    <input name="category" placeholder="category" />
    <input name="note" placeholder="note" />
    <button type="submit">Create</button>
</form>

<h2>Items</h2>
<button id="refresh">Refresh</button>
<a id="export" href="/export.csv">Export CSV</a>
<table id="items">
    <thead><tr><th>ID</th><th>Kind</th><th>Amount</th><th>Category</th><th>Note</th><th>Created</th></tr></thead>
    <tbody></tbody>
</table>

<h2>Analytics</h2>
<button id="getAnalytics">Get analytics (last 30 days)</button>
<pre id="analytics"></pre>

<script>
    async function fetchJSON(url, opts) {
        const r = await fetch(url, opts);
        if (!r.ok) throw new Error(await r.text());
        return r.json();
    }

    document.getElementById('addForm').addEventListener('submit', async e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = {
            kind: fd.get('kind'),
            amount: parseFloat(fd.get('amount')),
            category: fd.get('category'),
            note: fd.get('note'),
            created_at: new Date().toISOString()
        };
        await fetchJSON('/items', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
        loadItems();
    });

    async function loadItems(){
        const items = await fetchJSON('/items');
        const tbody = document.querySelector('#items tbody');
        tbody.innerHTML = '';
        items.forEach(it => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${it.id}</td><td>${it.kind}</td><td>${it.amount.toFixed(2)}</td><td>${it.category||''}</td><td>${it.note||''}</td><td>${new Date(it.created_at).toLocaleString()}</td>`;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('refresh').addEventListener('click', loadItems);
    document.getElementById('getAnalytics').addEventListener('click', async () => {
        const to = new Date(); const from = new Date(Date.now() - 30*24*3600*1000);
        const a = await fetchJSON(`/analytics?from=${from.toISOString()}&to=${to.toISOString()}`);
        document.getElementById('analytics').textContent = JSON.stringify(a, null, 2);
    });

    loadItems();
</script>
</body>
</html>
