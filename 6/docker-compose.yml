services:
  db:
    image: postgres:15
    container_name: sales-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salesdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrator:
    image: migrate/migrate:v4.17.0
    container_name: sales-migrator
    command: [
      "-path", "/migrations",
      "-database", "postgres://postgres:postgres@db:5432/salesdb?sslmode=disable",
      "up"
    ]
    volumes:
      - ./migrations:/migrations
    depends_on:
      db:
        condition: service_healthy
    restart: "on-failure"

  app:
    build: .
    container_name: sales-app
    environment:
      DATABASE_URL: "postgres://postgres:postgres@db:5432/salesdb?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  pgdata:
