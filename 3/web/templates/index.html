<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Комментарии</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f6fa; }
        h1 { color: #333; }
        .comment { background: white; border:1px solid #ddd; border-radius:6px; padding:10px; margin:10px 0; }
        .comment .children { margin-left: 20px; }
        .author { font-weight: bold; color: #0055aa; }
        .controls { margin-top: 6px; }
        button { margin-right: 5px; padding:4px 8px; border:none; border-radius:5px; background:#0078d7; color:white; cursor:pointer; }
        button.delete { background:#d9534f; }
        button:hover { opacity:0.9; }
        input, textarea { width:100%; margin-top:5px; margin-bottom:10px; padding:8px; border-radius:5px; border:1px solid #ccc; }
        #searchBox { display:flex; gap:10px; margin-bottom:20px; }
    </style>
</head>
<body>

<h1>Комментарии</h1>

<div id="searchBox">
    <input type="text" id="search" placeholder="Поиск по комментариям...">
    <button onclick="searchComments()">Найти</button>
    <button onclick="resetSearch()">Сбросить</button>
</div>

<div id="comments-container"></div>

<h3>Добавить комментарий</h3>
<input id="new-author" placeholder="Ваше имя">
<textarea id="new-content" placeholder="Ваш комментарий..."></textarea>
<button onclick="addComment(null)">Отправить</button>

<script>
    async function loadComments(search = "") {
        let url = '/api/comments';
        if (search) url += `?search=${encodeURIComponent(search)}`;
        const res = await fetch(url);
        if (!res.ok) return console.error("Ошибка при загрузке:", res.statusText);
        const data = await res.json();
        const container = document.getElementById('comments-container');
        container.innerHTML = '';
        data.forEach(c => renderComment(c, container));
    }

    function renderComment(comment, container) {
        const div = document.createElement('div');
        div.className = 'comment';
        div.dataset.id = comment.id;

        div.innerHTML = `
        <div class="author">${comment.author || 'Аноним'}</div>
        <div class="content">${comment.content}</div>
        <div class="controls">
            <button onclick="showReplyBox(${comment.id}, this)">Ответить</button>
            <button class="delete" onclick="deleteComment(${comment.id})">Удалить</button>
        </div>
    `;

        const childrenDiv = document.createElement('div');
        childrenDiv.className = 'children';
        div.appendChild(childrenDiv);
        container.appendChild(div);

        if (comment.children && comment.children.length) {
            comment.children.forEach(child => renderComment(child, childrenDiv));
        }
    }

    function addComment(parentId) {
        const content = parentId ? document.getElementById(`reply-content-${parentId}`).value :
            document.getElementById('new-content').value;
        const author  = parentId ? document.getElementById(`reply-author-${parentId}`).value :
            document.getElementById('new-author').value;
        if (!content.trim()) return alert('Введите текст комментария');

        fetch('/api/comments', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ parent_id: parentId, author, content })
        }).then(() => {
            if (!parentId) {
                document.getElementById('new-author').value = "";
                document.getElementById('new-content').value = "";
            } else {
                document.getElementById(`reply-box-${parentId}`).remove();
            }
            loadComments();
        });
    }

    function deleteComment(id) {
        if (!confirm('Удалить этот комментарий и все ответы?')) return;
        fetch(`/api/comments/${id}`, { method: 'DELETE' })
            .then(() => loadComments());
    }

    function showReplyBox(id, btn) {
        if (document.getElementById(`reply-box-${id}`)) return;
        const box = document.createElement('div');
        box.id = `reply-box-${id}`;
        box.innerHTML = `
        <textarea id="reply-content-${id}" placeholder="Ваш ответ"></textarea>
        <input type="text" id="reply-author-${id}" placeholder="Ваше имя">
        <button onclick="addComment(${id})">Отправить</button>
    `;
        btn.parentNode.appendChild(box);
    }

    function searchComments() {
        const term = document.getElementById('search').value.trim();
        loadComments(term);
    }

    function resetSearch() {
        document.getElementById('search').value = "";
        loadComments();
    }

    loadComments();
</script>

</body>
</html>
