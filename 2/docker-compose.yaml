version: "3.9"

services:
  db:
    image: postgres:16
    container_name: urlshortener_db
    environment:
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: pass1
      POSTGRES_DB: urlshortener
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user1 -d urlshortener"]
      interval: 3s
      retries: 5

  app:
    build: .
    container_name: urlshortener_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://user1:pass1@db:5432/urlshortener?sslmode=disable
    ports:
      - "8085:8080"
    volumes:
      - ./ui:/ui  # монтируем UI для быстрого тестирования и обновлений
    restart: always

volumes:
  pgdata:
