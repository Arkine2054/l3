services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: notifier
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user", "-d", "notifier"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  migrate:
    image: migrate/migrate
    command: [
      "-path", "/migrations",
      "-database", "postgres://user:pass@postgres:5432/notifier?sslmode=disable",
      "up"
    ]
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: pass

  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    container_name: notifier-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_URL: postgres://user:pass@postgres:5432/notifier?sslmode=disable
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8083:8083"

  worker:
    build:
      context: .
      dockerfile: cmd/worker/Dockerfile
    container_name: notifier-worker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_URL: postgres://user:pass@postgres:5432/notifier?sslmode=disable
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      SMTP_ADDR: mailhog:1025
      SMTP_FROM: no-reply@example.com

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
